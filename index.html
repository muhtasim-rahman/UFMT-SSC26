<!DOCTYPE html>
<html lang="bn">
    <!-- 📄 DOCUMENT HEADER & METADATA -->
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#6366f1">
        <meta name="description" content="FMT Tracker Pro - Advanced Merit Tracking System">
        <title>Udvash FMT Tracker (SSC-26) ~ TURZO [V14]/title>
        
        <!-- 🎨 FONTS & ICONS -->
        <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        
        <!-- 🖌️ STYLESHEET -->
        <link rel="stylesheet" href="style.css" />
    </head>

    <body class="light-theme">
        
        <!-- 🔒 SECTION: SECURITY PIN GATE -->
        <div id="pinGate">
            <!-- Theme Toggle on Pin Screen -->
            <div class="pin-header-actions">
                 <button id="pinThemeToggle" class="theme-switch-sm">
                    <i class="fas fa-sun sun-icon"></i>
                    <i class="fas fa-moon moon-icon"></i>
                </button>
            </div>

            <div class="pin-box-wrapper">
                <div class="pin-content-top">
                    <div class="pin-header lock-icon-area">
<div class="lock-animation-container">
    <div id="lockBtn" class="btn-lock">
        <svg class="lock-svg" viewBox="0 0 64 64">
            <path class="shackle" d="M18 28V18C18 10.268 24.268 4 32 4C39.732 4 46 10.268 46 18V28"></path>
            <rect class="lock-body" x="12" y="28" width="40" height="32" rx="6"></rect>
            <circle class="keyhole" cx="32" cy="44" r="5"></circle>
        </svg>
        <div class="particles" id="particles"></div>
    </div>
</div>

                    <h2>সিকিউরিটি পিন</h2>
                </div>

                    <!-- Pin Input Display -->
                    <div class="pin-field-wrapper">
                        <input id="pinInput" type="password" maxlength="6" inputmode="numeric" readonly />
                        
                        <div class="pin-visual-layer">
                            <div class="v-dot" data-index="0"></div>
                            <div class="v-dot" data-index="1"></div>
                            <div class="v-dot" data-index="2"></div>
                            <div class="v-dot" data-index="3"></div>
                            <div class="v-dot" data-index="4"></div>
                            <div class="v-dot" data-index="5"></div>
                        </div>
                    </div>

                    <!-- Pin Controls -->
                    <div class="pin-controls-row">
                        <div class="pin-view-ctrl right-aligned">
                            <span>পিন দেখুন</span>
                            <label class="toggle-switch-thin">
                                <input type="checkbox" id="pinViewToggle">
                                <span class="slider-thin"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Virtual Keypad -->
                <div class="virtual-keypad">
                    <button class="key-btn" data-key="1">1</button>
                    <button class="key-btn" data-key="2">2</button>
                    <button class="key-btn" data-key="3">3</button>
                    <button class="key-btn" data-key="4">4</button>
                    <button class="key-btn" data-key="5">5</button>
                    <button class="key-btn" data-key="6">6</button>
                    <button class="key-btn" data-key="7">7</button>
                    <button class="key-btn" data-key="8">8</button>
                    <button class="key-btn" data-key="9">9</button>
                    <button class="key-btn action-key backspace" data-key="BACK"><i class="fas fa-backspace"></i></button>
                    <button class="key-btn" data-key="0">0</button>
                    <button class="key-btn action-key enter-key" id="unlockBtn" data-key="ENTER"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

        <!-- 📱 SECTION: MAIN APPLICATION -->
        <div id="app" class="hidden">
            
            <!-- 🧊 SIDEBAR NAVIGATION (Desktop) -->
            <aside id="sidebar" class="sidebar collapsed">
                <div class="sidebar-header">
                    <div class="logo-wrapper" id="mainLogo">
                        <i class="fas fa-bolt-lightning logo-icon"></i>
                        <i class="fas fa-bars-staggered menu-icon"></i>
                    </div>
                    <button id="closeSidebar" class="close-trigger"><i class="fas fa-xmark"></i></button>
                </div>
                <nav class="nav-links">
                    <button class="tabBtn active" data-target="tabInput"><i class="fas fa-plus-circle"></i><span>ডাটা এন্ট্রি</span></button>
                    <button class="tabBtn" data-target="tabTable"><i class="fas fa-table-list"></i><span>রিপোর্ট শিট</span></button>
                    <button class="tabBtn" data-target="tabGraph"><i class="fas fa-chart-line"></i><span>বিশ্লেষণ</span></button>
                    <button class="tabBtn" data-target="tabPin"><i class="fas fa-user-gear"></i><span>সেটিংস</span></button>
                </nav>
            </aside>

            <!-- 🚀 MAIN CONTENT AREA -->
            <main class="main-wrapper">
                
                <!-- 🧢 HEADER -->
                <header class="main-header">
                    <div class="header-inner">
                        <div class="header-left">
                            <i class="fas fa-bolt-lightning mobile-logo"></i>
                            <div class="page-info">
                                <h2 id="viewTitle">ড্যাশবোর্ড</h2>
                                <p id="dateSub">-- ডিসেম্বর, ২০২৪</p>
                            </div>
                        </div>
                        <div class="header-tools">
                            <button id="refreshDataBtn" class="icon-btn-round" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>
                            <button id="themeToggle" class="theme-switch">
                                <span class="sun"><i class="fas fa-sun"></i></span>
                                <span class="moon"><i class="fas fa-moon"></i></span>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="content-body">
                    
                    <!-- 🎛️ SECTION: FILTERS -->
<div id="filterBar" class="filter-container hidden">
    <div class="filter-grid-wrapper">
        <div class="filter-inputs-area">
            <div class="f-group-box">
                <label>বছর</label>
                <select id="yearSelect" class="year-select">
                    <option value="">সব বছর</option>
                </select>
            </div>
            
            <div class="f-group-box">
                <label>মাস</label>
                <select id="monthSelect" class="month-select">
                    <option value="">সব মাস</option>
                    <option value="01">জানুয়ারি</option><option value="02">ফেব্রুয়ারি</option>
                    <option value="03">মার্চ</option><option value="04">এপ্রিল</option>
                    <option value="05">মে</option><option value="06">জুন</option>
                    <option value="07">জুলাই</option><option value="08">আগস্ট</option>
                    <option value="09">সেপ্টেম্বর</option><option value="10">অক্টোবর</option>
                    <option value="11">নভেম্বর</option><option value="12">ডিসেম্বর</option>
                </select>
            </div>
            
            <div class="f-group-box">
                <label>শুরু (Range)</label>
                <input type="date" id="startDate" class="start-date">
            </div>
            
            <div class="f-group-box">
                <label>শেষ (Range)</label>
                <input type="date" id="endDate" class="end-date">
            </div>
        </div>
        
        <div class="filter-action-area">
            <button id="resetFilters" class="f-clear">
                <i class="fas fa-rotate"></i><span>রিসেট</span>
            </button>
        </div>
    </div>
</div>


                    <!-- 📂 SECTION: TAB CONTENTS -->
                    <div class="tab-pane">
                        
                        <!-- 1. DATA ENTRY TAB -->
                        <section id="tabInput" class="tab-item active">
                            <div class="glass-card">
                                <h3 style="margin-bottom: 15px;"><i class="fas fa-pen-to-square"></i> নতুন তথ্য যোগ করুন</h3>
                                <div class="form-row">
                                    <div class="input-container"><label>ব্রাঞ্চ মেরিট</label><input type="number" id="branchVal" placeholder="উদা: ৪২" inputmode="numeric" /></div>
                                    <div class="input-container"><label>সেন্ট্রাল মেরিট</label><input type="number" id="centralVal" placeholder="উদা: ১২০০" inputmode="numeric" /></div>
                                </div>
                                <button id="saveEntry" class="btn primary-btn btn-block">সংরক্ষণ করুন</button>
                            </div>
                        </section>

                        <!-- 2. REPORT TABLE TAB -->
                        <section id="tabTable" class="tab-item hidden">
                            <div class="glass-card no-padding table-responsive-container">
                                <div class="table-holder">
                                    <table id="mainTable" class="custom-table">
                                        <thead><tr><th>ক্রমিক</th><th>তারিখ ও সময়</th><th>ব্রাঞ্চ</th><th>সেন্ট্রাল</th></tr></thead>
                                        <tbody id="tableRows"></tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <!-- 3. ANALYSIS GRAPH TAB -->
                        <section id="tabGraph" class="tab-item hidden">
                            <div class="summary-grid-6">
                                <div class="sum-box primary"><span>ব্রাঞ্চ (বর্তমান)</span><h3 id="sumBranch">-</h3></div>
                                <div class="sum-box primary"><span>সেন্ট্রাল (বর্তমান)</span><h3 id="sumCentral">-</h3></div>
                                <div class="sum-box gold"><span>সেরা ব্রাঞ্চ</span><h3 id="sumBestBranch">-</h3></div>
                                <div class="sum-box gold"><span>সেরা সেন্ট্রাল</span><h3 id="sumBestCentral">-</h3></div>
                                <div class="sum-box accent"><span>সর্বশেষ আপডেট</span><h3 id="sumLastDate">-</h3></div>
                                <div class="sum-box accent"><span>মোট এন্ট্রি</span><h3 id="sumTotal">0</h3></div>
                            </div>
                            
                            <div class="chart-wrapper-grid">
                                <div class="glass-card chart-card">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                        <div>
                                            <h4 class="chart-title">ব্রাঞ্চ মেরিট প্রগ্রেস</h4>
                                            <p class="chart-caption">আপনার ব্রাঞ্চ পজিশন এর ধারাবাহিক পরিবর্তন</p>
                                        </div>
                                        <button class="expand-chart-btn hidden" id="btnExpandBranch" title="Expand Graph"><i class="fas fa-expand"></i></button>
                                    </div>
                                    <div class="chart-container"><canvas id="branchChart"></canvas></div>
                                </div>
                                
                                <div class="glass-card chart-card">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                        <div>
                                            <h4 class="chart-title">সেন্ট্রাল মেরিট প্রগ্রেস</h4>
                                            <p class="chart-caption">আপনার সেন্ট্রাল পজিশন এর ধারাবাহিক পরিবর্তন</p>
                                        </div>
                                        <button class="expand-chart-btn hidden" id="btnExpandCentral" title="Expand Graph"><i class="fas fa-expand"></i></button>
                                    </div>
                                    <div class="chart-container"><canvas id="centralChart"></canvas></div>
                                </div>
                            </div>

                            <div class="glass-card analysis-guide-box">
                                <h4 style="margin-bottom: 12px; font-size: 14px;"><i class="fas fa-circle-info"></i> গ্রাফ বিশ্লেষণ নির্দেশিকা</h4>
                                <div class="guide-content"> <p class="guide-caption">গ্রাফটি পরীক্ষাভিত্তিক মেধাক্রম ট্র্যাক করতে তৈরি, যা সময়ের সাথে অবস্থানের উন্নতি বা অবনতি স্পষ্টভাবে বুঝতে সাহায্য করে।</p>
                              
                                    <div class="guide-item"><i class="fas fa-arrow-trend-down text-success"></i> গ্রাফের রেখা নিচের দিকে নামলে মেধাক্রমের উন্নতি (পজিশন এগিয়ে আসা) বোঝায়।</div>
                                    <div class="guide-item"><i class="fas fa-arrow-trend-up text-danger"></i> গ্রাফের রেখা উপরের দিকে উঠলে মেধাক্রমের অবনতি (পজিশন পিছিয়ে যাওয়া) বোঝায়।</div>
                                    <div class="guide-item"><i class="fas fa-chart-line text-primary"></i> X অক্ষ বরাবর রিপোর্ট নম্বর এবং Y অক্ষ বরাবর আপনার মেধাক্রম (Rank) দেখানো হয়েছে।</div>
                                </div>
                            </div>
                        </section>

                        <!-- 4. SETTINGS TAB -->
                        <section id="tabPin" class="tab-item hidden">
                            <div class="glass-card config-row-item">
                                <div class="set-info"><h3><i class="fas fa-shield-halved"></i> অটো পিন ভেরিফাই</h3><p>৬ ডিজিট হলেই অটো চেক হবে</p></div>
                                <label class="toggle-switch"><input type="checkbox" id="pinAutoToggleSet"><span class="toggle-slider"></span></label>
                            </div>

                            <div class="glass-card config-row-item">
                                <div class="set-info"><h3><i class="fas fa-moon"></i> ডার্ক মোড</h3><p>চোখের আরামের জন্য ব্যবহার করুন</p></div>
                                <label class="toggle-switch"><input type="checkbox" id="darkToggleSet"><span class="toggle-slider"></span></label>
                            </div>

                            <div class="glass-card config-row-item">
                                <div class="set-info"><h3><i class="fas fa-bell"></i> নোটিফিকেশন</h3><p>রিমাইন্ডার অন বা অফ করুন</p></div>
                                <label class="toggle-switch"><input type="checkbox" id="notifEnableToggle"><span class="toggle-slider"></span></label>
                            </div>

                            <div class="glass-card">
                                <h3><i class="fas fa-clock"></i> রিমাইন্ডার শিডিউল</h3>
                                <div class="reminder-ui">
                                    <div class="rem-input-box">
                                        <input type="time" id="notifTime">
                                        <button id="addTimeBtn" class="add-rem-btn"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div id="notifList" class="reminder-list"></div>
                                </div>
                            </div>

                            <div class="glass-card">
                                <h3><i class="fas fa-lock"></i> পিন পরিবর্তন</h3>
                                <div class="pin-change-form">
                                    <div class="input-with-icon"><input type="password" id="oldPinSet" placeholder="বর্তমান পিন" maxlength="6" inputmode="numeric"><button class="pass-toggle" onclick="togglePass('oldPinSet')"><i class="fas fa-eye"></i></button></div>
                                    <div class="input-with-icon"><input type="password" id="newPinSet" placeholder="নতুন পিন (সংখ্যা)" maxlength="6" inputmode="numeric"></div>
                                    <div class="input-with-icon"><input type="password" id="confirmPinSet" placeholder="নিশ্চিত করুন" maxlength="6" inputmode="numeric"></div>
                                    <button id="changePinBtn" class="btn primary-btn">আপডেট</button>
                                </div>
                            </div>

                            <div class="glass-card config-row-item reset-card">
                                <div class="set-info"><h3 class="text-danger"><i class="fas fa-trash"></i> ফ্যাক্টরি রিসেট</h3><p>সিস্টেমের সকল ডাটা মুছে ফেলুন</p></div>
                                <button id="factoryResetBtn" class="btn danger-btn-alt">রিসেট</button>
                            </div>
                        </section>
                    </div>
                </div>

                <!-- 📱 SECTION: MOBILE BOTTOM NAV -->
                <nav class="mobile-bottom-nav">
                    <button class="m-nav-link active" data-target="tabInput"><i class="fas fa-circle-plus"></i><span>এন্ট্রি</span></button>
                    <button class="m-nav-link" data-target="tabTable"><i class="fas fa-table-list"></i><span>রিপোর্ট</span></button>
                    <button class="m-nav-link" data-target="tabGraph"><i class="fas fa-chart-pie"></i><span>চার্ট</span></button>
                    <button class="m-nav-link" data-target="tabPin"><i class="fas fa-sliders"></i><span>সেটিংস</span></button>
                </nav>
            </main>
        </div>
        
        <!-- 🧩 SECTION: MODALS & OVERLAYS -->
        <div id="standardModal" class="reset-overlay hidden">
            <div id="modalContent" class="reset-popup"></div>
        </div>

        <div id="statusToast" class="toast"></div>

        <!-- 🔌 SECTION: SCRIPTS -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="app.js"></script>
    </body>
</html>
